<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#456b67">
  <meta name="description" content="Gefühlskompass Phase 2 – Gefühle dialogbasiert erkunden und lernen.">
  <title>Gefühlskompass</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=0.25">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><div><strong>Gefühlskompass</strong><small>v0.25</small></div></div>
      <button id="restart" class="icon-button" title="Dialog neu starten">↻</button>
    </header>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-page="dialog" class="nav active"><span>⌖</span>Erkunden</button>
      <button data-page="history" class="nav"><span>▤</span>Verlauf</button>
      <button data-page="stats" class="nav"><span>◔</span>Auswertung</button>
      <button data-page="catalog" class="nav"><span>☷</span>Katalog</button>
    </nav>
    <main id="content" class="content"></main>
  </div>
  <dialog id="modal"><form method="dialog" id="modal-body"></form></dialog>
  <input id="catalog-file" type="file" accept="application/json,.json" hidden>
  <input id="data-file" type="file" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast hidden"></div>
  <script src="jszip.min.js?v=0.25"></script>
  <script src="app.js?v=0.25"></script>
</body>
</html>
