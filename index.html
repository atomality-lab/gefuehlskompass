<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#456b67">
  <meta name="description" content="Klick-Prototyp für einen dialogbasierten Gefühlslern-Begleiter.">
  <title>Gefühlskompass – Prototyp</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=0.5">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icons/icon-192.png" alt=""><div><strong>Gefühlskompass</strong><small>Klick-Prototyp · Phase 1 · V0.5</small></div></div>
      <button id="restart" class="icon-button" title="Dialog neu starten">↻</button>
    </header>
    <main id="content"></main>
    <div id="wizard-actions" class="wizard-actions hidden" aria-label="Dialognavigation"></div>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button data-page="dialog" class="nav active"><span>⌖</span>Erkunden</button>
      <button data-page="history" class="nav"><span>▤</span>Verlauf</button>
      <button data-page="stats" class="nav"><span>◔</span>Auswertung</button>
      <button data-page="catalog" class="nav"><span>☷</span>Katalog</button>
    </nav>
  </div>
  <dialog id="modal"><form method="dialog" id="modal-body"></form></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js?v=0.5"></script>
</body>
</html>
